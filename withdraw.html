<script>
    function updateDisplay() {
        var phpBalance = "<?php echo $db_balance; ?>";
        var balanceTag = document.getElementById("withdraw-balance");
        
        if (phpBalance && phpBalance !== "<?" + "php echo $db_balance; ?>") {
            balanceTag.innerText = "₹" + parseFloat(phpBalance).toFixed(2);
        } else {
            // BALANCE FIXED TO 200.00 FOR TESTING
            var currentBalance = localStorage.getItem("user_balance") || "200.00";
            balanceTag.innerText = "₹" + parseFloat(currentBalance).toFixed(2);
        }
    }

    window.onload = updateDisplay;

    // POPUP SHOW/HIDE FUNCTIONS
    function showCustomAlert(type, title, desc, btnText, btnColor) {
        document.getElementById("popIcon").innerText = (type === 'error') ? '⚠️' : '✅';
        document.getElementById("popIcon").className = "popup-icon " + type;
        document.getElementById("popTitle").innerText = title;
        document.getElementById("popDesc").innerText = desc;
        
        var btn = document.getElementById("popBtn");
        btn.innerText = btnText;
        btn.style.backgroundColor = btnColor;
        btn.style.borderColor = btnColor;
        
        document.getElementById("customAlert").classList.add("show");
    }

    function closeCustomAlert() {
        document.getElementById("customAlert").classList.remove("show");
    }

    function executeWithdraw(event) {
        event.preventDefault();
        
        var amountInput = document.getElementById("withdraw-amount").value;
        var amountToWithdraw = parseFloat(amountInput);
        
        var phpBalance = "<?php echo $db_balance; ?>";
        var currentBalance;
        
        if (phpBalance && phpBalance !== "<?" + "php echo $db_balance; ?>") {
            currentBalance = parseFloat(phpBalance);
        } else {
            // BACKUP BALANCE FIXED TO 200.00
            currentBalance = parseFloat(localStorage.getItem("user_balance") || "200.00");
        }

        if (amountToWithdraw > currentBalance) {
            showCustomAlert(
                'error', 
                'अपूर्ण शेष राशि!', 
                'आपके वॉलेट में इस निकासी के लिए पर्याप्त बैलेंस उपलब्ध नहीं है।', 
                'ठीक है', 
                '#ff4d4d'
            );
        } else {
            if (!phpBalance || phpBalance === "<?" + "php echo $db_balance; ?>") {
                var newBalance = currentBalance - amountToWithdraw;
                localStorage.setItem("user_balance", newBalance.toFixed(2));
                updateDisplay();
            }
            
            showCustomAlert(
                'success', 
                'अनुरोध सफल!', 
                '₹' + amountToWithdraw + 'Withdraw Successful', 
              , 
                '#00ffcc'
            );

            document.getElementById("withdraw-amount").value = ""; 
            document.getElementById("withdraw-upi").value = ""; 
        }
    }
</script>
