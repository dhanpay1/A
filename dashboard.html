<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhan Pay - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b111e; color: #ffffff; padding: 15px 15px 100px 15px; }
        
        .user-profile { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #141d30; padding: 12px; border-radius: 10px; border: 1px solid #1e293b; }
        .user-details h3 { font-size: 15px; color: #00ffcc; }
        .user-details p { font-size: 11px; color: #8fa0bc; margin-top: 3px; }

        .balance-card { background: linear-gradient(135deg, #16223f 0%, #0f172a 100%); border: 1px solid #1e293b; border-radius: 15px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .balance-card span { color: #8fa0bc; font-size: 12px; }
        .balance-card h1 { font-size: 32px; color: #ffffff; margin: 8px 0 15px 0; }
        .card-actions { display: flex; gap: 12px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase; }
        .btn-recharge { background: linear-gradient(90deg, #00ffcc, #00b3ff); color: #0b111e; box-shadow: 0 4px 12px rgba(0, 255, 204, 0.2); }
        .btn-withdraw { background: #ef4444; color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }

        /* PREMIUM QUICK GRID */
        .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px; }
        .quick-item { background: #141d30; padding: 14px 5px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #1e293b; transition: background 0.2s; }
        .quick-item:active { background: #1e293b; }
        .quick-item .icon-svg { width: 22px; height: 22px; margin: 0 auto 6px auto; display: block; fill: #8fa0bc; }
        .quick-item:hover .icon-svg, .quick-item:active .icon-svg { fill: #00ffcc; filter: drop-shadow(0 0 3px rgba(0,255,204,0.4)); }
        .quick-item p { font-size: 11px; color: #cbd5e1; font-weight: 500; }

        /* --- NEW ADDED PROMO BANNER STYLE --- */
        .promo-banner { 
            background: linear-gradient(135deg, #142037 0%, #0f182a 100%); 
            border: 1px solid #1e293b; 
            border-radius: 15px; 
            padding: 22px 20px; 
            margin-bottom: 25px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            position: relative; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
        }
        .banner-content { z-index: 2; }
        .banner-percentage { font-size: 42px; font-weight: 900; color: #00ffcc; line-height: 1; filter: drop-shadow(0 0 5px rgba(0,255,204,0.3)); }
        .banner-text-main { font-size: 16px; font-weight: bold; color: #ffffff; letter-spacing: 0.5px; margin-top: 5px; }
        .banner-text-sub { font-size: 11px; color: #8fa0bc; margin-top: 5px; }
        .banner-graphic { z-index: 1; position: absolute; right: 20px; bottom: 8px; }
        .banner-graphic-svg { width: 65px; height: 65px; fill: rgba(0, 255, 204, 0.12); }

        /* FIXED BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; background-color: #111827; border-top: 2px solid #1e293b; display: flex; justify-content: space-around; padding: 12px 0; z-index: 9999; }
        .nav-item { background: none; border: none; color: #8fa0bc; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; width: 20%; font-size: 11px; text-decoration: none; }
        .nav-item.active { color: #00ffcc; font-weight: bold; }
        .nav-svg { width: 20px; height: 20px; fill: #8fa0bc; display: block; }
        .nav-item.active .nav-svg { fill: #00ffcc; filter: drop-shadow(0 0 3px rgba(0, 255, 204, 0.4)); }
    </style>
</head>
<body>

    <!-- CLEAN & CLEANED SINGLE BALANCING SCRIPT -->
    <script>
        window.onload = function() {
            if (!localStorage.getItem("user_balance")) {
                localStorage.setItem("user_balance", "200.00");
            }
            
            var currentBalance = parseFloat(localStorage.getItem("user_balance") || "200.00");
            document.getElementById("main-balance").innerText = "₹" + currentBalance.toFixed(2);

            var savedPhone = localStorage.getItem("saved_phone");
            if(savedPhone) {
                document.getElementById("display-id").innerText = "Account: " + savedPhone;
            }
        };
    </script>
