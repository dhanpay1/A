<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhan Pay - My Orders</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0b111e;
            color: #ffffff;
            padding: 15px 15px 100px 15px;
        }

        /* Top Summary Area */
        .summary-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border: 1px solid #1e293b;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .summary-card span {
            color: #8fa0bc;
            font-size: 12px;
        }
        .summary-card h2 {
            font-size: 26px;
            color: #00ffcc;
            margin-top: 5px;
        }

        /* Section Title */
        .section-title {
            font-size: 16px;
            color: #00ffcc;
            margin: 20px 0 12px 0;
            font-weight: 600;
            border-left: 4px solid #00ffcc;
            padding-left: 8px;
        }

        /* Active Order Cards */
        .order-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .order-row-card {
            background: #141d30;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-left: 4px solid #00ffcc;
        }
        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
        }
        .order-top h4 {
            font-size: 14px;
            color: #ffffff;
        }
        .status-running {
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .order-middle {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            text-align: center;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
        }
        .data-box text {
            display: block;
            font-size: 11px;
            color: #8fa0bc;
            margin-bottom: 3px;
        }
        .data-box num {
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
        }
        .data-box .green-text {
            color: #00ffcc;
        }

        /* Live Timer Style */
        .timer-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
        }
        .timer-label {
            color: #8fa0bc;
        }
        .timer-countdown {
            color: #ff9900;
            font-weight: bold;
        }

        /* Modern Cashout Button Style */
        .cashout-btn {
            background-color: #1f293d;
            color: #64748b;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: not-allowed;
            transition: all 0.3s ease;
        }
        .cashout-btn.active {
            background-color: #00ffcc;
            color: #0b111e;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.2);
        }

        /* No Order Message */
        .no-order {
            text-align: center;
            color: #8fa0bc;
            font-size: 14px;
            padding: 4px 0;
        }

        /* FIXED BOTTOM NAVIGATION BAR */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; width: 100%;
            background-color: #111827; border-top: 2px solid #1e293b;
            display: flex; justify-content: space-around; padding: 12px 0; z-index: 9999;
        }
        .nav-item {
            background: none; border: none; color: #8fa0bc;
            display: flex; flex-direction: column; align-items: center;
            gap: 5px; cursor: pointer; width: 20%; font-size: 11px; text-decoration: none;
        }
        .nav-item.active { color: #00ffcc; font-weight: bold; }
        .nav-svg { width: 20px; height: 20px; fill: #8fa0bc; display: block; }
        .nav-item.active .nav-svg { fill: #00ffcc; filter: drop-shadow(0 0 3px rgba(0, 255, 204, 0.4)); }
    </style>
</head>
<body>

    <!-- Orders Page Summary -->
    <div class="summary-card">
        <span>Total Investment Assets (कुल निवेश)</span>
        <h2 id="total-assets">₹0.00</h2>
    </div>

    <!-- Active Orders Section -->
    <h3 class="section-title">My Running Income Records</h3>

    <div class="order-container" id="order-list-container">
        <!-- Agar koi plan nahi khareeda hoga to ye dikhega -->
        <div class="no-order" id="empty-message">No Active Plan</div>
        
        <!-- RUNNING PLAN RECORD -->
        <div class="order-row-card" id="plan-card" style="display: none;">
            <div class="order-top">
                <h4 id="plan-title">Dhanpay VIP Plan - 01</h4>
                <span class="status-running" id="plan-status">Running ⚡</span>
            </div>
            <div class="order-middle">
                <div class="data-box">
                    <text>Amount</text>
                    <num class="green-text" id="plan-amount">₹400.00</num>
                </div>
                <div class="data-box">
                    <text>Profit</text>
                    <num id="plan-profit">₹48+25.00</num>
                </div>
                <div class="data-box">
                    <text>Total Return</text>
                    <num id="plan-total" style="color: #00ffcc;">₹473.00</num>
                </div>
            </div>
            
            <!-- Live Time Counter Block -->
            <div class="timer-box">
                <span class="timer-label">Remaining Time:</span>
                <span class="timer-countdown" id="live-timer">12:00:00</span>
            </div>

            <!-- Smart Cashout Button -->
            <button class="cashout-btn" id="cashout-action-btn" onclick="processCashout()" disabled>
                Lock Earnings (12 Hours)
            </button>
        </div>

    </div>

    <!-- FIXED BOTTOM NAVIGATION BAR (ORDERS ACTIVE) -->
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="buy.html" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
            <span>Buy</span>
        </a>
        <a href="orders.html" class="nav-item active">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2zm-9.83-3.25l.03-.12H18.5c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1v2h2l3.6 7.59-1.35 2.44C4.52 15.37 5.48 17 7 17h12v-2H7l1.1-2z"/></svg>
            <span>Orders</span>
        </a>
        <a href="withdraw.html" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
            <span>Withdraw</span>
        </a>
        <a href="mine.html" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Mine</span>
        </a>
    </div>

    <!-- Live System JavaScript Core -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Demo data simulate karne ke liye agar buy page se data na aaye
            if(!localStorage.getItem("has_active_plan")) {
                localStorage.setItem("has_active_plan", "true");
                localStorage.setItem("plan_cost", "400.00");
            }

            var hasPlan = localStorage.getItem("has_active_plan");
            if (hasPlan === "true") {
                document.getElementById('empty-message').style.display = 'none';
                document.getElementById('plan-card').style.display = 'flex';
                
                var cost = parseFloat(localStorage.getItem("plan_cost") || "400.00");
                document.getElementById('total-assets').innerText = "₹" + cost.toFixed(2);
                document.getElementById('plan-amount').innerText = "₹" + cost.toFixed(2);

                if(cost === 800) {
                    document.getElementById('plan-title').innerText = "Dhanpay VIP Plan - 02";
                    document.getElementById('plan-profit').innerText = "₹96+50.00";
                    document.getElementById('plan-total').innerText = "₹946.00";
                } else if(cost === 1600) {
                    document.getElementById('plan-title').innerText = "VIP Plan - 03";
        // 12-घंटे का लाइव काउंटडाउन टाइमर इंजन
        function startTimer() {
            var duration = 12 * 60 * 60; // 12 Hours in seconds
            var timerDisplay = document.getElementById('live-timer');
            var cashoutBtn = document.getElementById('cashout-action-btn');

            var timer = setInterval(function () {
                var hours = parseInt(timer / 3600, 10);
                var minutes = parseInt((timer % 3600) / 60, 10);
                var seconds = parseInt(timer % 60, 10);

                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                timerDisplay.textContent = hours + ":" + minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(timer);
                    timerDisplay.textContent = "00:00:00";
                    timerDisplay.style.color = "#00ffcc";
                    document.getElementById('plan-status').innerText = "Completed ✅";
                    
                    // 12 घंटे पूरे होने पर बटन एक्टिवेट हो जाएगा
                    cashoutBtn.disabled = false;
                    cashoutBtn.classList.add('active');
                    cashoutBtn.innerText = "Claim Earnings";
                }
            }, 1000);
        }

        // अर्निंग क्लेम करने का फंक्शन
        function processCashout() {
            alert("Earnings claimed successfully! Balance updated.");
        }
    </script>
</body>
</html>
