<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhan Pay - Change Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b111e; color: #ffffff; padding: 20px 15px 100px 15px; }
        
        /* Top Navigation Header */
        .back-header { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; }
        .back-btn { background: #141d30; border: 1px solid #1e293b; color: #00ffcc; font-size: 16px; font-weight: bold; padding: 8px 14px; border-radius: 8px; text-decoration: none; cursor: pointer; }
        .section-title { font-size: 18px; color: #00ffcc; font-weight: 600; border-left: 4px solid #00ffcc; padding-left: 8px; }
        
        /* Premium Form Card */
        .password-card { background: #141d30; border: 1px solid #1e293b; border-radius: 12px; padding: 25px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-top: 15px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 12px; color: #8fa0bc; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; background: #0b111e; border: 1px solid #1e293b; border-radius: 8px; color: #ffffff; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #00ffcc; }
        
        .submit-btn { width: 100%; background: linear-gradient(90deg, #00ffcc, #00b3ff); color: #0b111e; border: none; padding: 13px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(0, 255, 204, 0.2); }
        .submit-btn:active { transform: scale(0.98); }

        /* FIXED BOTTOM NAVIGATION BAR */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; background-color: #111827; border-top: 2px solid #1e293b; display: flex; justify-content: space-around; padding: 12px 0; z-index: 9999; }
        .nav-item { background: none; border: none; color: #8fa0bc; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; width: 20%; font-size: 11px; text-decoration: none; }
        .nav-item.active { color: #00ffcc; font-weight: bold; }
        .nav-svg { width: 20px; height: 20px; fill: #8fa0bc; display: block; }
        .nav-item.active .nav-svg { fill: #00ffcc; filter: drop-shadow(0 0 3px rgba(0, 255, 204, 0.4)); }

        /* PREMIUM OFFLINE POPUP DIALOG STYLE */
        .custom-popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 17, 30, 0.85); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 10000; visibility: hidden; opacity: 0; transition: opacity 0.2s ease, visibility 0.2s ease; }
        .custom-popup-box { background: #141d30; border: 1px solid #1e293b; border-radius: 16px; width: 85%; max-width: 340px; padding: 25px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transform: scale(0.8); transition: transform 0.2s ease; }
        .popup-icon { font-size: 45px; margin-bottom: 12px; display: inline-block; }
        .popup-icon.error { color: #ff4d4d; }
        .popup-icon.success { color: #00ffcc; }
        .popup-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #ffffff; }
        .popup-desc { font-size: 13px; color: #8fa0bc; line-height: 1.5; margin-bottom: 20px; }
        .popup-btn { background: #1e293b; color: #ffffff; border: 1px solid #334155; padding: 10px 24px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; min-width: 100px; }
        .custom-popup-overlay.show { visibility: visible; opacity: 1; }
        .custom-popup-overlay.show .custom-popup-box { transform: scale(1); }
    </style>
</head>
<body>

    <!-- Back to Profile Header -->
    <div class="back-header">
        <a href="mine.html" class="back-btn">➔</a>
        <h3 class="section-title">Security Center</h3>
    </div>

    <!-- Password Management Form -->
    <div class="password-card">
        <form onsubmit="handlePasswordUpdate(event)">
            <div class="form-group">
                <label>Old Password (पुराना पासवर्ड)</label>
                <input type="password" id="old-pass" placeholder="Enter old password" required>
            </div>
            
            <div class="form-group">
                <label>New Password (नया पासवर्ड)</label>
                <input type="password" id="new-pass" placeholder="Enter new password (Min 6 chars)" minlength="6" required>
            </div>

            <div class="form-group">
                <label>Confirm New Password (पासवर्ड की पुष्टि करें)</label>
                <input type="password" id="confirm-pass" placeholder="Re-enter new password" minlength="6" required>
            </div>

            <button type="submit" class="submit-btn">Update Password</button>
        </form>
    </div>

    <!-- OFFLINE CUSTOM POPUP DIALOG -->
    <div id="customAlert" class="custom-popup-overlay">
        <div class="custom-popup-box">
            <span id="popIcon" class="popup-icon">⚠️</span>
            <div id="popTitle" class="popup-title">Title</div>
            <div id="popDesc" class="popup-desc">Description text.</div>
            <button onclick="closeCustomAlert()" id="popBtn" class="popup-btn">ठीक है</button>
        </div>
    </div>

    <!-- FIXED BOTTOM NAVIGATION BAR -->
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="buy.html" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
            <span>Buy</span>
        </a>
        <a href="orders.html" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2zm-9.83-3.25l.03-.12H18.5c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1v2h2l3.6 7.59-1.35 2.44C4.52 15.37 5.48 17 7 17h12v-2H7l1.1-2z"/></svg>
            <span>Orders</span>
        </a>
        <a href="withdraw.html" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
            <span>Withdraw</span>
        </a>
        <a href="mine.html" class="nav-item active">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Mine</span>
        </a>
    </div>

    <!-- JAVASCRIPT ENGINE -->
    <script>
        var currentStatus = "none"; // 'error' या 'success' ट्रैक करने के लिए

        function showCustomAlert(type, title, desc, btnText, btnColor) {
            currentStatus = type; // स्टेटस अपडेट करें
            
            document.getElementById("popIcon").innerText = (type === 'error') ? '⚠️' : '✅';
            document.getElementById("popIcon").className = "popup-icon " + type;
            document.getElementById("popTitle").innerText = title;
            document.getElementById("popDesc").innerText = desc;
            
            var btn = document.getElementById("popBtn");
            btn.innerText = btnText;
            btn.style.backgroundColor = btnColor;
            btn.style.borderColor = btnColor;
            
            document.getElementById("customAlert").classList.add("show");
        }

        function closeCustomAlert() {
            document.getElementById("customAlert").classList.remove("show");
            
            // अगर पासवर्ड चेंज सफल (success) हुआ है, तो ही वापस प्रोफाइल पर भेजेगा
            if (currentStatus === "success") {
                window.location.href = "mine.html";
            }
        }

        function handlePasswordUpdate(event) {
            event.preventDefault();
            
            var oldPass = document.getElementById("old-pass").value;
            var newPass = document.getElementById("new-pass").value;
            var confirmPass = document.getElementById("confirm-pass").value;

            // CONDITION 1: अगर पासवर्ड मैच नहीं हुआ तो PREMIUM ERROR BOX आएगा
            if (newPass !== confirmPass) {
                showCustomAlert(
                    'error',
                    'Match Error',
                    'New Password & Confirm Password Not Match',
                    'Check!',
                    '#ff4d4d'
                );
                return; // कोड को यहीं रोक देगा
            }

            // CONDITION 2: अगर पासवर्ड मैच हो गया तो PREMIUM SUCCESS BOX आएगा
            showCustomAlert(
                'success',
                'Success',
                'Password Change Success',
                'Done!',
                '#00ffcc'
            );

            // बॉक्स खाली करने के लिए
            document.getElementById("old-pass").value = "";
            document.getElementById("new-pass").value = "";
            document.getElementById("confirm-pass").value = "";
        }
    </script>
</body>
</html>
